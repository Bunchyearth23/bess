[package]
name = "bess"
version = "0.11.0"
edition = "2024"

[dependencies]
bdsp = { git = "ssh://git@github.com/bunchyearth23/bdsp", rev = "b2981d431d321d29224752a2f855495da965d4bb" }
eframe = "0.33"
cpal = "0.18.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3.5"
rfd = "0.15"
crossbeam-channel = "0.5"
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 3
